name: Facebook Phase D.5 (DRY RUN only)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
    - cron: "30 12 * * *"
permissions:
  contents: read
concurrency:
  group: facebook-safe-dry-run
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      AUTO_PUBLISH_ENABLED: "false"
      FACEBOOK_PUBLISH_ENABLED: "false"
      FACEBOOK_PAGE_ID: "296758006853316"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Generate post preview (NO publishing)
        run: node scripts/run-facebook-slot.mjs
