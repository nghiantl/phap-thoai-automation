name: Facebook Page connection check (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTO_PUBLISH_ENABLED: "false"
      FACEBOOK_PUBLISH_ENABLED: "false"
      FACEBOOK_PAGE_ID: "296758006853316"
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Check Facebook Page via GET only
        run: node scripts/check-facebook-connection.mjs
