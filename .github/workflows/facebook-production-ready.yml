name: Facebook D.9 publish pipeline (NOT ACTIVATED)
# Intentionally NO schedule or workflow_dispatch until release review.
# A future activation PR must add triggers and set LIVE_PUBLISH_RELEASE=true.
on:
  push:
    branches:
      - never-activate-facebook-d9
permissions:
  contents: write
concurrency:
  group: facebook-publish-serialized
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ vars.LIVE_PUBLISH_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    env:
      AUTO_PUBLISH_ENABLED: "true"
      FACEBOOK_PUBLISH_ENABLED: "true"
      PUBLISH_CONFIRMATION: "I_APPROVE_FACEBOOK_POSTING"
      FACEBOOK_PAGE_ID: "296758006853316"
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Publish one eligible slot with durable GitHub ref claim
        run: node scripts/run-facebook-slot.mjs
